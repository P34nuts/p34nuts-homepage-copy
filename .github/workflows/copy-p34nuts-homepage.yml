name: Copy P34nuts Homepage

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  copy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Checkout original P34nuts homepage
        uses: actions/checkout@v4
        with:
          repository: P34nuts/p34nuts-official-website
          ref: main
          path: source-homepage
          fetch-depth: 1
      - name: Replace target with exact source copy
        shell: bash
        run: |
          set -euo pipefail
          find . -mindepth 1 -maxdepth 1 ! -name '.git' ! -name 'source-homepage' -exec rm -rf -- {} +
          cp -a source-homepage/. .
          rm -rf source-homepage
      - name: Commit exact copy
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -f
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'Copy P34nuts homepage 1:1'
          git push
