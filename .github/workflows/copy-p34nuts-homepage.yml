name: Copy P34nuts Homepage

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  copy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download original homepage as ZIP
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 https://github.com/P34nuts/p34nuts-official-website/archive/refs/heads/main.zip -o source.zip
          unzip -q source.zip
          rm source.zip

      - name: Replace target with exact source copy
        shell: bash
        run: |
          set -euo pipefail
          SRC=$(find . -maxdepth 1 -type d -name 'p34nuts-official-website-*' | head -n 1)
          test -n "$SRC"
          find . -mindepth 1 -maxdepth 1 ! -name '.git' ! -name "$SRC" -exec rm -rf -- {} +
          cp -a "$SRC"/. .
          rm -rf "$SRC"
          test -f client/src/App.tsx
          test -f client/src/pages/Home.tsx
          test -f package.json
          echo "Source files copied successfully."

      - name: Commit exact copy
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -f .
          echo "Staged files:"
          git diff --cached --name-only | wc -l
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'Copy P34nuts homepage 1:1'
          git push origin HEAD:main
